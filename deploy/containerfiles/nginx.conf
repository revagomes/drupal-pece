user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 256M;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # Buffer settings
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # FastCGI cache settings
    fastcgi_cache_path /var/cache/nginx/fastcgi_cache levels=1:2 keys_zone=drupal:100m inactive=60m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

    # Upstream PHP-FPM
    upstream php_backend {
        server php:9000;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/html/web;
        index index.php index.html index.htm;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Protect files and directories from prying eyes
        location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml|svn-base)$|^(\..*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)?$ {
            deny all;
            return 404;
        }

        # Don't allow direct access to PHP files in the vendor directory
        location ~ /vendor/.*\.php$ {
            deny all;
            return 404;
        }

        # Block access to scripts in site files directory
        location ~ ^/sites/[^/]+/files/.*\.php$ {
            deny all;
        }

        # Protect private files
        location ~ ^/sites/.*/private/ {
            return 403;
        }

        # Allow "Well-Known URIs" as per RFC 5785
        location ~* ^/.well-known/ {
            allow all;
        }

        # Block access to "hidden" files and directories
        location ~ (^|/)\. {
            return 403;
        }

        # Drupal clean URLs
        location / {
            try_files $uri /index.php?$query_string;
        }

        # Handle image styles for Drupal
        location ~ ^/sites/.*/files/styles/ {
            try_files $uri /index.php?$query_string;
        }

        # Handle public files
        location ~* ^/sites/.*/files/ {
            access_log off;
            expires 30d;
            try_files $uri /index.php?$query_string;
        }

        # Advanced Aggregation module CSS/JS files
        location ~* files/(css|js)/ {
            access_log off;
            expires 1y;
            try_files $uri @rewrite;
        }

        # Serve static files directly
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            access_log off;
            expires max;
            log_not_found off;
            add_header Cache-Control "public, immutable";
        }

        # Handle PHP files
        location ~ '\.php$|^/update.php' {
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;

            # Ensure the php file exists
            try_files $fastcgi_script_name =404;

            # Mitigate https://httpoxy.org/ vulnerabilities
            fastcgi_param HTTP_PROXY "";

            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;

            include fastcgi_params;

            # FastCGI settings
            fastcgi_intercept_errors on;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;

            # Don't cache by default
            set $no_cache 1;

            # Cache static content
            if ($request_uri ~* "^/[^/]+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$") {
                set $no_cache 0;
            }

            fastcgi_cache_bypass $no_cache;
            fastcgi_no_cache $no_cache;
        }

        # Deny access to .htaccess files
        location ~ /\.ht {
            deny all;
        }

        # Robots.txt fallback
        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        # Favicon fallback
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
    }
}
