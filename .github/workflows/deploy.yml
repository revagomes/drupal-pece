name: Deploy

on:
  push:
    branches: [feature/k8s-do-deployment]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Build PHP and Nginx images and push to GHCR
  # -----------------------------------------------------------------------
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building with tags: latest, ${SHA_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/containerfiles/Containerfile.php
          target: production
          push: true
          tags: |
            ghcr.io/pece-project/drupal-pece/php:latest
            ghcr.io/pece-project/drupal-pece/php:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: deploy/containerfiles
          file: deploy/containerfiles/Containerfile.nginx
          push: true
          tags: |
            ghcr.io/pece-project/drupal-pece/nginx:latest
            ghcr.io/pece-project/drupal-pece/nginx:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # -----------------------------------------------------------------------
  # Job 2: Deploy to VPS 1 via SSH
  # Requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to VPS 1 (Easypanel)
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/vps_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key

      - name: Copy docker-compose.yml to VPS
        run: |
          scp -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            deploy/docker-compose/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/docker-compose.yml"

      - name: Write .env file on VPS
        run: |
          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ secrets.VPS_DEPLOY_PATH }}' && cat > '${{ secrets.VPS_DEPLOY_PATH }}/.env'" << 'EOF'
          PHP_IMAGE=ghcr.io/pece-project/drupal-pece/php:${{ needs.build.outputs.image_tag }}
          NGINX_IMAGE=ghcr.io/pece-project/drupal-pece/nginx:${{ needs.build.outputs.image_tag }}
          DB_NAME=${{ secrets.DB_NAME || 'drupal' }}
          DB_USER=${{ secrets.DB_USER || 'drupal' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DRUPAL_TRUSTED_HOST=${{ secrets.DRUPAL_TRUSTED_HOST }}
          EOF

      - name: Pull images and restart services
        run: |
          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_DEPLOY_PATH }}' && docker compose pull && docker compose up -d --remove-orphans"

      - name: Verify running services
        run: |
          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_DEPLOY_PATH }}' && docker compose ps"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
